<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- SEO: per-page title, description, canonical, robots, Open Graph, Twitter
       and per-page JSON-LD are injected per route by src/components/Seo.jsx
       (and baked into static HTML at build time by scripts/prerender.mjs).
       The default title below is only a fallback for un-prerendered routes. -->
  <title>Velcor.ai | AI Revenue Infrastructure for Modern B2B Growth</title>

  <meta name="keywords" content="AI revenue infrastructure, AI outbound, RevOps, sales automation, B2B lead generation, AI sales systems, CRM automation, revenue operations, GTM automation, pipeline generation, outbound automation" />

  <meta name="theme-color" content="#f6f1e8" />

  <!-- Site-wide entity graph (Organization + WebSite). Per-page WebPage,
       BreadcrumbList and Service/Article nodes are injected per route by src/components/Seo.jsx -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://velcor.ai/#organization",
        "name": "Velcor.ai",
        "url": "https://velcor.ai/",
        "logo": {
          "@type": "ImageObject",
          "@id": "https://velcor.ai/#logo",
          "url": "https://velcor.ai/logo.png",
          "contentUrl": "https://velcor.ai/logo.png",
          "caption": "Velcor.ai"
        },
        "image": { "@id": "https://velcor.ai/#logo" },
        "description": "Velcor.ai builds AI-powered outbound systems, RevOps automation, CRM workflows, and revenue infrastructure for ambitious B2B companies worldwide.",
        "slogan": "AI Revenue Infrastructure for Modern B2B Growth",
        "email": "team@velcor.ai",
        "areaServed": { "@type": "Place", "name": "Worldwide" },
        "knowsAbout": [
          "AI revenue infrastructure",
          "Outbound sales automation",
          "Revenue operations (RevOps)",
          "CRM automation",
          "B2B lead generation",
          "Go-to-market (GTM) strategy",
          "B2B SaaS growth",
          "Mergers and acquisitions deal sourcing",
          "Private equity deal flow",
          "AI and deep-tech go-to-market",
          "Financial services revenue systems"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://velcor.ai/#website",
        "url": "https://velcor.ai/",
        "name": "Velcor.ai",
        "description": "AI Revenue Infrastructure for Modern B2B Growth",
        "publisher": { "@id": "https://velcor.ai/#organization" },
        "inLanguage": "en"
      }
    ]
  }
  </script>
  <!--app-head-->
</head>
<body><div id="root"><!--app-html--></div><script type="module" src="/src/main.jsx"></script></body>
</html>
